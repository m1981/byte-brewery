<script>
(() => {
  const root = document.getElementById('vcs-time-pilot');
  const data = JSON.parse(document.getElementById('vcs-time-data').textContent);
  const repo = root.querySelector('#vcs-time-repo');
  const gap = root.querySelector('#vcs-time-gap');
  const status = root.querySelector('#vcs-time-status');
  const cap = root.querySelector('#vcs-time-cap');
  const summary = root.querySelector('#vcs-time-summary');
  const body = root.querySelector('#vcs-time-rows');
  const date = new Intl.DateTimeFormat('pl-PL', {timeZone: 'Europe/Warsaw', day: '2-digit', month: '2-digit', year: 'numeric'});
  const time = new Intl.DateTimeFormat('pl-PL', {timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});
  const asDate = value => new Date(Number(value / 1000000n));

  function groupRows(rows) {
    const result = [];
    const sorted = rows.filter(r => r[0] !== null).map(r => BigInt(r[0])).sort((a,b) => a > b ? -1 : a < b ? 1 : 0);
    const limit = BigInt(gap.value) * 1000000000n;
    for (const timestamp of sorted) {
      let current = result[result.length - 1];
      if (!current || current[current.length - 1] - timestamp > limit ||
          (cap.checked && current[0] - timestamp > 900000000000n)) {
        current = [];
        result.push(current);
      }
      current.push(timestamp);
    }
    return result;
  }

  function render() {
    const records = data[repo.value];
    const statuses = status.checked ? ['Conflicts', 'Staged', 'Changes', 'Unversioned'] : ['Wszystkie'];
    body.replaceChildren();
    let sections = 0;
    let visibleRows = 0;
    for (const name of statuses) {
      const subset = records.filter(r => name === 'Wszystkie' || r[1].includes(name));
      const groups = groupRows(subset);
      visibleRows += subset.length;
      sections += groups.length;
      for (const group of groups) {
        const start = asDate(group[group.length - 1]);
        const end = asDate(group[0]);
        const firstDate = date.format(start);
        const lastDate = date.format(end);
        const range = time.format(start) === time.format(end) && firstDate === lastDate
          ? time.format(end) : time.format(start) + '–' + (firstDate === lastDate ? '' : lastDate + ' ') + time.format(end);
        const row = document.createElement('tr');
        const when = document.createElement('td');
        const day = document.createElement('div');
        day.textContent = firstDate;
        const hours = document.createElement('div');
        hours.className = 'text-small tabular-nums';
        hours.textContent = range;
        when.append(day, hours);
        const state = document.createElement('td');
        state.textContent = name;
        const count = document.createElement('td');
        count.className = 'text-end tabular-nums';
        count.textContent = String(group.length);
        row.append(when, state, count);
        body.append(row);
      }
      const unknown = subset.filter(r => r[0] === null).length;
      if (unknown) {
        sections += 1;
        const row = document.createElement('tr');
        for (const label of ['Czas nieznany', name, String(unknown)]) {
          const cell = document.createElement('td'); cell.textContent = label; row.append(cell);
        }
        body.append(row);
      }
    }
    summary.textContent = records.length + ' unikalnych plików · ' + visibleRows + ' wierszy · ' + sections + ' sekcji';
  }

  function restore(saved) {
    const choice = saved && saved.modelContent;
    if (!choice || !Object.hasOwn(data, choice.repo)) return;
    repo.value = choice.repo;
    if (['30','60','120','300','600','900'].includes(String(choice.gap))) gap.value = String(choice.gap);
    if (typeof choice.perStatus === 'boolean') status.checked = choice.perStatus;
    if (typeof choice.cap === 'boolean') cap.checked = choice.cap;
    render();
  }
  for (const input of [repo, gap, status, cap]) input.addEventListener('change', () => {
    render();
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({modelContent: {repo: repo.value, gap: Number(gap.value), perStatus: status.checked, cap: cap.checked}}).catch(() => {});
    }
  });
  render();
  if (window.openai) restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals', event => restore(event.detail && event.detail.globals && event.detail.globals.widgetState));
})();
</script>
