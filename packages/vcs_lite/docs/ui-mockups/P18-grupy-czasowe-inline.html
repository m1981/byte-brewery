<style>
  #vcs-p18-preview { padding: 16px 0; }
  #vcs-p18 {
    color-scheme: light dark;
    --p18-bg: light-dark(#ffffff, #202024);
    --p18-chrome: light-dark(#f5f5f7, #2a2a2f);
    --p18-ink: light-dark(#1d1d1f, #eeeeef);
    --p18-dim: light-dark(#6e6e73, #aaaab2);
    --p18-line: light-dark(#dedee3, #43434a);
    --p18-selected: light-dark(#e3eefc, #253d5a);
    --p18-hover: light-dark(#f5f7fb, #292e37);
    --p18-mod: light-dark(#002daa, #88adff);
    --p18-unv: light-dark(#a92c3e, #f299a8);
    --p18-plus: light-dark(#1f7a3a, #85d39b);
    --p18-minus: light-dark(#c2302a, #ff9390);
    --p18-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    --p18-mono: ui-monospace, "SF Mono", Menlo, monospace;
    font: 13px/1.4 var(--p18-font); color: var(--p18-ink);
    background: var(--p18-bg); border: 1px solid var(--p18-line); border-radius: 9px;
    overflow: hidden; container-type: inline-size;
  }
  #vcs-p18 * { box-sizing: border-box; }
  #vcs-p18 .p18-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--p18-chrome); border-bottom: 1px solid var(--p18-line); }
  #vcs-p18 .p18-repo { font-weight: 600; }
  #vcs-p18 .p18-view { margin-left: auto; color: var(--p18-dim); font-size: 12px; }
  #vcs-p18 .p18-heading { height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px 0 28px; color: var(--p18-dim); font-size: 11.5px; border-bottom: 1px solid var(--p18-line); }
  #vcs-p18 .p18-heading span:last-child { flex: none; width: 116px; text-align: right; }
  #vcs-p18 .p18-group { margin: 0; padding: 6px 16px 3px; height: 26px; font-size: 11px; line-height: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--p18-dim); }
  #vcs-p18 .p18-group span { margin-left: 8px; font-weight: 400; letter-spacing: 0; }
  #vcs-p18 .p18-time { min-height: 24px; display: flex; align-items: center; gap: 10px; padding: 3px 16px 3px 28px; color: var(--p18-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  #vcs-p18 .p18-time::after { content: ''; flex: 1; border-bottom: 1px solid var(--p18-line); }
  #vcs-p18 .p18-file { width: 100%; height: 24px; display: flex; align-items: center; gap: 16px; padding: 0 16px 0 28px; border: 0; border-radius: 0; background: var(--p18-bg); text-align: left; font: inherit; color: inherit; }
  #vcs-p18 .p18-file:hover { background: var(--p18-hover); }
  #vcs-p18 .p18-file[aria-pressed="true"] { background: var(--p18-selected); }
  #vcs-p18 .p18-filename { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  #vcs-p18 .p18-name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--p18-mod); }
  #vcs-p18 .p18-folder { color: var(--p18-dim); font-size: 12px; min-width: 0; flex: 0 100000 auto; overflow: hidden; text-overflow: ellipsis; }
  #vcs-p18 .p18-unversioned .p18-name { color: var(--p18-unv); }
  #vcs-p18 .p18-deleted .p18-name { color: var(--p18-dim); text-decoration: line-through; }
  #vcs-p18 .p18-counts { width: 116px; flex: none; display: grid; grid-template-columns: 54px 54px; gap: 8px; text-align: right; font: 12px var(--p18-mono); font-variant-numeric: tabular-nums; }
  #vcs-p18 .p18-plus { color: var(--p18-plus); }
  #vcs-p18 .p18-minus { color: var(--p18-minus); }
  #vcs-p18 .p18-zero { color: var(--p18-dim); }
  #vcs-p18 .p18-hint { display: none; flex: none; color: var(--p18-dim); font-size: 11.5px; }
  #vcs-p18 .p18-file:hover .p18-hint { display: inline; }
  #vcs-p18 .p18-bottom { height: 8px; }
  @container (max-width: 650px) { #vcs-p18 .p18-file:hover .p18-hint { display: none; } }
  @container (max-width: 400px) {
    #vcs-p18 .p18-folder { display: none; }
    #vcs-p18 .p18-toolbar { gap: 6px; }
  }
  @media (pointer: coarse) { #vcs-p18 .p18-file { height: 44px; } }
</style>

<script>
(() => {
  const root = document.getElementById('vcs-p18');
  const rows = Array.from(root.querySelectorAll('.p18-file'));
  rows.forEach(row => row.addEventListener('click', () => {
    rows.forEach(other => other.setAttribute('aria-pressed', String(other === row)));
  }));
})();
</script>
